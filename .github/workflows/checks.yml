name: Report checks
on:
  pull_request:
  push:
    branches: [probable_main_upgrade]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
