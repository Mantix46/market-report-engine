name: Daily Market Report

on:
  # Uruchomienie kontrolowane przez cron-job.org (POST workflow_dispatch)
  # lub ręcznie z poziomu strony GitHuba.
  workflow_dispatch:
  schedule:
    # W niedzielę i poniedziałek zbieramy tylko filingi SEC do następnego maila.
    - cron: '17 5 * * 0,1'

concurrency:
  group: market-report-private-state
  cancel-in-progress: false

jobs:
  preview:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/probable_main_upgrade'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies and run tests
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest -q

      - name: Generate report preview without SMTP
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL || vars.SEC_CONTACT_EMAIL }}
          SEC_TICKERS: NBIS,MU,FPS,AAOI,AVGO
        run: |
          set -euo pipefail
          cp watchlists.example.json watchlists.json
          python main.py --preview > report-preview.md
          for heading in '# RAPORT RYNKOWY' '## SEC EDGAR' '## 9. Sentyment' '## 10. Watchlist'; do
            if ! grep -Fq "$heading" report-preview.md; then
              echo "::error::Nie wygenerowano pełnego podglądu. Brakuje sekcji: $heading"
              exit 1
            fi
          done
          if [[ -z "$SEC_CONTACT_EMAIL" ]]; then
            echo "::warning::Brak SEC_CONTACT_EMAIL. Podgląd sprawdził zachowanie bez dostępu do SEC."
          fi

      - name: Upload sample report
        uses: actions/upload-artifact@v4
        with:
          name: market-report-preview
          path: report-preview.md
          retention-days: 3

  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Publiczne repo nie zapisuje własnego stanu. Zapis do prywatnego repo
    # autoryzuje osobny, ograniczony STATE_REPO_TOKEN.
    permissions:
      contents: read

    steps:
      - name: Checkout public application
        uses: actions/checkout@v6
        with:
          path: app

      - name: Checkout private state
        uses: actions/checkout@v6
        with:
          repository: Mantix46/market-report-state
          token: ${{ secrets.STATE_REPO_TOKEN }}
          path: state

      - name: Restore private configuration and state
        run: |
          set -euo pipefail
          files=(watchlists.json)
          if [[ "$GITHUB_EVENT_NAME" != "schedule" ]]; then
            files+=(daily_snapshots.csv prediction_tracker.csv)
          fi
          for file in "${files[@]}"; do
            test -f "state/$file" || { echo "::error::Missing state/$file"; exit 1; }
            cp "state/$file" "app/$file"
          done
          mkdir -p app/state
          for file in sec_edgar.json earnings_consensus.json; do
            if [[ -f "state/$file" ]]; then
              cp "state/$file" "app/state/$file"
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Market Report Engine
        if: github.event_name == 'workflow_dispatch'
        working-directory: app
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL || vars.SEC_CONTACT_EMAIL }}
          SEC_TICKERS: ${{ vars.SEC_TICKERS }}
        run: python main.py

      - name: Poll SEC without generating or sending a report
        if: github.event_name == 'schedule'
        working-directory: app
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL || vars.SEC_CONTACT_EMAIL }}
          SEC_TICKERS: ${{ vars.SEC_TICKERS }}
        run: python main.py --sec-poll-only

      - name: Copy updated state
        if: success()
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "schedule" ]]; then
            cp app/daily_snapshots.csv state/daily_snapshots.csv
            cp app/prediction_tracker.csv state/prediction_tracker.csv
          fi
          for file in sec_edgar.json earnings_consensus.json; do
            if [[ -f "app/state/$file" ]]; then
              cp "app/state/$file" "state/$file"
            fi
          done

      - name: Commit updated private state
        if: success()
        working-directory: state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "$GITHUB_EVENT_NAME" != "schedule" ]]; then
            git add daily_snapshots.csv prediction_tracker.csv
          fi
          for file in sec_edgar.json earnings_consensus.json; do
            if [[ -f "$file" ]]; then
              git add "$file"
            fi
          done
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "data: update report state [skip ci]"
            git push
          fi
